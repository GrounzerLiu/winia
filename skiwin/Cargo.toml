[package]
name = "skiwin"
version = "0.1.0"
edition = "2021"

[features]
# Backends. `SkiaWindow::new` tries the compiled ones in the order vulkan → gl → cpu unless
# WINIA_RENDER_BACKEND pins one (docs/rendering-backends.md).
#
# Careful with skia-bindings: it resolves its prebuilt Skia archive by an EXACT feature key
# (e.g. ...-x86_64-pc-windows-msvc-d3d-gl-jpegd-jpege-pdf-svg-textlayout-vulkan), and only a fixed
# set of keys is published. Enabling a GPU feature on skiwin alone therefore asks for a key that may
# not exist and silently falls back to compiling Skia from source. winia's manifest pins the full
# Windows feature set so that every winia build resolves to a published archive — check backend
# features through winia, not through skiwin.
vulkan = ["ash", "vulkano", "skia-safe/vulkan", "skia-safe/gpu"]
gl = ["skia-safe/gl", "skia-safe/gpu", "glutin", "glutin-winit", "raw-window-handle"]
textlayout = ["skia-safe/textlayout"]
#d3d = ["skia-safe/d3d", "windows"]


[dependencies]
winit = { workspace = true }
skia-safe = { workspace = true }
softbuffer = "0.4"
ash = { version = "0.38.0", optional = true }
vulkano = { version = "0.35.2", optional = true }
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
once_cell = "1.21.4"
parking_lot = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
