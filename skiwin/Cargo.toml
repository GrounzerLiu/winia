[package]
name = "skiwin"
version = "0.1.0"
edition = "2021"

[features]
# 注意：feature 组合必须匹配 skia-binaries 发布页中实际存在的预编译二进制文件
# Windows 可用: gl-jpegd-jpege-pdf-textlayout-vulkan
# 需要 skia-safe features: gl + vulkan + textlayout + gpu
vulkan = ["ash", "vulkano", "skia-safe/vulkan", "skia-safe/gpu"]
gl = ["skia-safe/gl", "skia-safe/gpu", "glutin", "glutin-winit", "raw-window-handle"]
# textlayout 是必需的：不启用则无法命中 gl-*-textlayout-vulkan 二进制
textlayout = ["skia-safe/textlayout"]
#d3d = ["skia-safe/d3d", "windows"]

[dependencies]
winit = { workspace = true }
skia-safe = { workspace = true }
softbuffer = "0.4"
ash = { version = "0.38.0", optional = true }
vulkano = { version = "0.35.2", optional = true }
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
once_cell = "1.21.4"
parking_lot = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
