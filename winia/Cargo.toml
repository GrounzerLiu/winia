[package]
name = "winia"
version = "0.2.0"
edition = "2024"
description = "A declarative UI framework powered by Skia — Compose-inspired, pure Rust"

[features]
# Both GPU backends are on by default so a machine without a Vulkan ICD still renders on the GPU:
# `SkiaWindow::new` tries Vulkan, then GL, then the CPU/softbuffer path. Pin one backend with
# `WINIA_RENDER_BACKEND=vulkan|gl|cpu` — see docs/rendering-backends.md.
default = ["vulkan", "gl"]
vulkan = ["skiwin/vulkan"]
gl = ["skiwin/gl"]
debug-server = []
# Windows UI Automation provider: publishes the semantics tree (`crate::semantics`) to screen
# readers and to any UIA client, over the window's own HWND. OFF by default — it needs the `windows`
# crate, and a plain build should not carry a COM server it does not use. See docs/semantics.md.
accessibility = ["dep:windows", "dep:windows-core"]
# Per-frame animation trace (`anim_trace`): records every animated subject's layout vs painted
# geometry plus its opacity so a run can be inspected afterwards. OFF by default — without it every
# emission point is a no-op that compiles away. The output path comes from WINIA_ANIM_TRACE; no
# application code is involved either way.
anim-trace = []
# Material Symbols 可变字体图标（默认不启用——Icon 默认不内置任何图标）。
# 每个特性内嵌对应主题的字体文件（10~15MB）与 4200+ 码点常量表。
material-symbols-outlined = []
material-symbols-rounded = []
material-symbols-sharp = []

[dependencies]
skiwin = { path = "../skiwin" }
winia-macros = { path = "../winia-macros" }
winit = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
material-shapes = { workspace = true }
letclone = { workspace = true }
# svg feature 所有平台启用（Icon 的 SVG 渲染依赖 skia_safe::svg——
# 不能只在 Windows target 依赖里开，否则 Linux/macOS 编译失败）
skia-safe = { workspace = true, features = ["svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30"
material-colors = "0.4"
dark-light = "3.0"
unicode-segmentation = "1.12"
arboard = "3"

[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { workspace = true, features = ["vulkan", "textlayout", "svg", "gl", "d3d"] }
# The UIA bridge (feature `accessibility`) and nothing else. `Win32_UI_Shell` is where
# SetWindowSubclass lives — winit does not forward WM_GETOBJECT, so the window procedure has to be
# hooked to answer it.
# `#[implement]` generates paths through `::windows_core`, so the core crate has to be a
# dependency in its own right, not just a transitive one.
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
[dev-dependencies]
serde_json = "1"

# ── UI-test fixtures: ONE bin target (cargo test does not run it; path is target/debug/fixture_all.exe) ──
# tests/ui_test.rs drives it over the stdin/stdout pipe (independent of examples — test assets).
# Every scenario lives in this one binary and is selected by argv[1]. A scenario used to be its own
# [[bin]], i.e. its own full skia link plus ~30 MB exe / ~125 MB PDB each (measured at 18 fixtures:
# 538 MB of exes + 2.26 GB of PDBs, and every lib change relinked all of them — cargo links in
# parallel, which is where the memory spike came from). Adding a scenario is a module + a SCENARIOS row.
[[bin]]
name = "fixture_all"
path = "tests/ui_fixtures/fixture_all.rs"

# ── Benchmarks: ONE target with its own harness (no criterion — see the file's header) ──
# `cargo bench -p winia`. The figures are checked into docs/benchmarks.md with the machine they came
# from; this is a measuring stick for changes, not a cross-machine scoreboard.
[[bench]]
name = "recompose"
harness = false
