[package]
name = "winia"
version = "0.2.0"
edition = "2024"
description = "A declarative UI framework powered by Skia — Compose-inspired, pure Rust"

[features]
default = ["vulkan"]
vulkan = ["skiwin/vulkan"]
gl = ["skiwin/gl"]
debug-server = []

[dependencies]
skiwin = { path = "../skiwin" }
winit = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
skia-safe = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30"
material-colors = "0.4"
dark-light = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { workspace = true, features = ["vulkan", "textlayout", "svg", "gl", "d3d"] }
