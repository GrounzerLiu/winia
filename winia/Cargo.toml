[package]
name = "winia"
version = "0.2.0"
edition = "2024"
description = "A declarative UI framework powered by Skia — Compose-inspired, pure Rust"

[features]
default = ["vulkan"]
vulkan = ["skiwin/vulkan"]
gl = ["skiwin/gl"]
debug-server = []

[dependencies]
skiwin = { path = "../skiwin" }
winia-macros = { path = "../winia-macros" }
winit = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
skia-safe = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30"
material-colors = "0.4"
dark-light = "2.0"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { workspace = true, features = ["vulkan", "textlayout", "svg", "gl", "d3d"] }
[dev-dependencies]
serde_json = "1"

# ── UI 测试 fixture（bin target——cargo test 不执行；路径固定 target/debug/fixture_*）──
# 供 tests/ui_test.rs 通过 stdin/stdout 管道驱动（不依赖 examples——测试资产独立）
[[bin]]
name = "fixture_click"
path = "tests/ui_fixtures/fixture_click.rs"

[[bin]]
name = "fixture_toggle"
path = "tests/ui_fixtures/fixture_toggle.rs"

[[bin]]
name = "fixture_subwindow"
path = "tests/ui_fixtures/fixture_subwindow.rs"

[[bin]]
name = "fixture_scroll"
path = "tests/ui_fixtures/fixture_scroll.rs"

[[bin]]
name = "fixture_nest"
path = "tests/ui_fixtures/fixture_nest.rs"
