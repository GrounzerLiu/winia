[workspace]
resolver = "2"
members = [
    "winia",
    "winia-macros",
    "skiwin",
    "material-shapes",
]

[workspace.metadata.orphan-gc]
enabled = true
dry-run = false
inner-wrapper = "sccache"
pending-sweeps-per-compile = 4

# Release keeps its symbols and line tables. `cargo bench` uses this profile, and the layout-cost
# investigation in docs/benchmarks.md is exactly the kind of question whose answer is a stack trace
# rather than a frame timer — without this a profile of a bench run is a wall of addresses.
# Cost: larger artifacts in the release output, which this repository does not ship.
[profile.release]
debug = 1

[workspace.dependencies]
winit = "0.31.0-beta.3"
skia-safe = "0.99.0"
skia-bindings = "0.99.0"
material-shapes = { path = "material-shapes", features = ["shape_util"] }
parking_lot = "0.12"
log = "0.4"
thiserror = "2"
letclone = "0.3.0"
